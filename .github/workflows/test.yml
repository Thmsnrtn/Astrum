name: Test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Undefined-identifier check
        run: npm run lint
      - name: Unit + architecture tests (includes the import-cycle guard)
        run: npx vitest run
      # Runners keep UTC, where the device's day, the UTC day, and London's
      # day coincide — the case that hid wrong planetary hours and sect
      # everywhere else. Re-run the suite on a clock far from Greenwich.
      - name: Unit tests on a non-UTC device clock
        run: TZ=America/Los_Angeles npx vitest run
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E (smoke + offline + sync + ux + roots)
        run: bash e2e/run.sh
