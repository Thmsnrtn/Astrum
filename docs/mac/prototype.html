<title>Astrum for Mac</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* ==========================================================================
   Astrum for Mac — interactive prototype
   Source of truth: "Astrum for the Mac: Instrument & Edition", revision 2,
   and design-tokens.css (revision 2). Order: tokens → frame tokens → base →
   frame → native chrome (simulated) → components → views → responsive.
   ========================================================================== */

/* ---------- 1. Design tokens (design-tokens.css, rev 2) ---------- */
:root{color-scheme:light dark}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}

:root{
  --font-ui: system-ui, -apple-system, sans-serif;
  --font-display: system-ui, -apple-system, sans-serif;
  --font-read: ui-serif, "New York", "Iowan Old Style", Georgia, serif;
  --font-mono: ui-monospace, "SF Mono", monospace;
  --numeric-live: tabular-nums lining-nums;
  --numeric-prose: oldstyle-nums proportional-nums;
  --text-scale: 1;
  --floor-app: 10px;
  --floor-widget: 11px;

  --type-large-title: 700 calc(26px * var(--text-scale))/calc(32px * var(--text-scale)) var(--font-display);
  --type-title-1:     400 calc(22px * var(--text-scale))/calc(26px * var(--text-scale)) var(--font-display);
  --type-title-2:     400 calc(17px * var(--text-scale))/calc(22px * var(--text-scale)) var(--font-ui);
  --type-title-3:     400 calc(15px * var(--text-scale))/calc(20px * var(--text-scale)) var(--font-ui);
  --type-headline:    700 calc(13px * var(--text-scale))/calc(16px * var(--text-scale)) var(--font-ui);
  --type-body:        400 calc(13px * var(--text-scale))/calc(16px * var(--text-scale)) var(--font-ui);
  --type-body-emph:   600 calc(13px * var(--text-scale))/calc(16px * var(--text-scale)) var(--font-ui);
  --type-callout:     400 max(var(--floor-app), calc(12px * var(--text-scale)))/max(13px, calc(15px * var(--text-scale))) var(--font-ui);
  --type-subheadline: 400 max(var(--floor-app), calc(11px * var(--text-scale)))/max(13px, calc(14px * var(--text-scale))) var(--font-ui);
  --type-footnote:    400 max(var(--floor-app), calc(10px * var(--text-scale)))/max(13px, calc(13px * var(--text-scale))) var(--font-ui);
  --type-caption:     400 max(var(--floor-app), calc(10px * var(--text-scale)))/max(13px, calc(13px * var(--text-scale))) var(--font-ui);
  --type-display-l: 500 64px/68px var(--font-display);
  --type-display-m: 500 44px/48px var(--font-display);
  --type-display-s: 500 28px/32px var(--font-display);
  --type-read:        400 calc(17px * var(--text-scale))/calc(27px * var(--text-scale)) var(--font-read);
  --type-read-title:  500 calc(34px * var(--text-scale))/calc(40px * var(--text-scale)) var(--font-read);
  --type-transcript:  400 calc(15px * var(--text-scale))/calc(22px * var(--text-scale)) var(--font-read);
  --type-card:        400 calc(15px * var(--text-scale))/calc(22px * var(--text-scale)) var(--font-read);
  --type-liturgy:     400 calc(22px * var(--text-scale))/calc(34px * var(--text-scale)) var(--font-read);
  --type-rubric:      italic 400 calc(15px * var(--text-scale))/calc(22px * var(--text-scale)) var(--font-read);
  --type-quote:       italic 400 calc(15px * var(--text-scale))/calc(23px * var(--text-scale)) var(--font-read);
  --type-margin-note: italic 400 max(var(--floor-app), calc(12px * var(--text-scale)))/max(14px, calc(16px * var(--text-scale))) var(--font-read);
  --type-mono:        400 calc(12px * var(--text-scale))/calc(16px * var(--text-scale)) var(--font-mono);

  --mat-window:   light-dark(#F6F4EF, #0B0D12);
  --mat-platter:  light-dark(#FFFFFF, #141821);
  --mat-raised:   light-dark(#FBFAF7, #1B2030);
  --mat-sunken:   light-dark(#EFECE5, #07090D);
  --mat-paper:    light-dark(#FBF8F1, #16140F);
  --mat-chrome-fallback: light-dark(#F2F0EB, #12151C);
  --platter-border: 0 0 0 0 transparent;

  --label:   light-dark(#1D1D1F, #EDEFF3);
  --label-2: light-dark(#66666B, #A4A9B4);
  --label-3: light-dark(#7A7A80, #82889A);
  --label-4: light-dark(#C7C7CC, #3A3F4C);
  --ink:     light-dark(#23201B, #E8E2D4);
  --ink-2:   light-dark(#625A4E, #ABA393);
  --hairline:         light-dark(rgb(0 0 0 / 0.08), rgb(255 255 255 / 0.08));
  --separator-strong: light-dark(rgb(0 0 0 / 0.20), rgb(255 255 255 / 0.20));
  --fill:   light-dark(rgb(0 0 0 / 0.05), rgb(255 255 255 / 0.06));
  --fill-2: light-dark(rgb(0 0 0 / 0.09), rgb(255 255 255 / 0.10));

  --accent-gilt: light-dark(#85651A, #E8CF98);
  --accent: light-dark(var(--system-accent-light, #85651A), var(--system-accent-dark, #E8CF98));
  --on-accent: light-dark(#FFFFFF, #1A1405);
  --selection: color-mix(in oklab, var(--accent) 22%, transparent);
  --focus-outline: 3px solid color-mix(in oklab, var(--accent) 55%, transparent);
  --focus-offset: 1px;
  --now-needle:  var(--accent-gilt);
  --window-open: var(--accent-gilt);
  --figure-ring-color: var(--label);
  --figure-ring-width: 1.5px;
  --figure-ring-gap: 2px;
  --figure-selected-weight: 600;

  --planet-saturn:  light-dark(#5C4A32, #9C9284);
  --planet-jupiter: light-dark(#1D44A8, #4F7FF2);
  --planet-mars:    light-dark(#A3241A, #EC5A3C);
  --planet-sun:     light-dark(#B26F00, #FF9A2E);
  --planet-venus:   light-dark(#0A7D6E, #35C2A0);
  --planet-mercury: light-dark(#8A5CD0, #CBA8FF);
  --planet-moon:    light-dark(#2F5F84, #D3E0EC);
  --tint-pct: 14%;
  --tint-saturn:  color-mix(in oklab, var(--planet-saturn)  var(--tint-pct), var(--mat-platter));
  --tint-jupiter: color-mix(in oklab, var(--planet-jupiter) var(--tint-pct), var(--mat-platter));
  --tint-mars:    color-mix(in oklab, var(--planet-mars)    var(--tint-pct), var(--mat-platter));
  --tint-sun:     color-mix(in oklab, var(--planet-sun)     var(--tint-pct), var(--mat-platter));
  --tint-venus:   color-mix(in oklab, var(--planet-venus)   var(--tint-pct), var(--mat-platter));
  --tint-mercury: color-mix(in oklab, var(--planet-mercury) var(--tint-pct), var(--mat-platter));
  --tint-moon:    color-mix(in oklab, var(--planet-moon)    var(--tint-pct), var(--mat-platter));
  --cell-outline-width: 0px;
  --hour-hue: var(--planet-mars);

  --state-dignified:   var(--label);
  --state-minor:       var(--label);
  --state-debilitated: var(--label-2);
  --state-peregrine:   var(--label-2);
  --state-retro:       var(--label-2);
  --state-sun-relation:var(--label-2);
  --state-void:        light-dark(#7C7C82, #767C8C);
  --state-closed:      var(--label-3);
  --state-caution-ink: var(--label);
  --state-caution-fill: transparent;
  --verdict-ink:       var(--label);
  --provenance-fill:   var(--fill);
  --provenance-ink:    var(--label-2);
  --provenance-unsourced-ink: var(--label-2);
  --destructive: light-dark(#D70015, #FF453A);

  --hatch-w: 1px;
  --hatch-pitch: 4px;
  --tex-debility: repeating-linear-gradient(135deg, var(--state-debilitated) 0 var(--hatch-w), transparent var(--hatch-w) var(--hatch-pitch));
  --void-dot: 1px;
  --void-pitch: 6px;
  --tex-void: radial-gradient(circle, var(--state-void) 0 var(--void-dot), transparent calc(var(--void-dot) + 0.5px)) 0 0 / var(--void-pitch) var(--void-pitch);
  --void-outline: 1px solid var(--state-void);
  --closed-outline: 1px dashed var(--state-closed);
  --break-gap: 3px;
  --break-cap-width: 1.5px;

  --sky-night-top:       light-dark(oklch(0.945 0.015 265), oklch(0.14 0.015 265));
  --sky-night-bottom:    light-dark(oklch(0.935 0.020 265), oklch(0.17 0.020 265));
  --sky-day-top:         light-dark(oklch(0.97  0.020 235), oklch(0.21 0.040 245));
  --sky-day-bottom:      light-dark(oklch(0.95  0.030 230), oklch(0.26 0.045 235));
  --sky-top: var(--sky-day-top);
  --sky-bottom: var(--sky-day-bottom);
  /* The hour bloom: dark appearance only (6% by day). light-dark() takes colours, so the
     bloom is expressed as a colour rather than an opacity percentage. */
  --wash-hour-tint: light-dark(transparent, color-mix(in oklab, var(--hour-hue) 6%, transparent));
  --wash-hour: radial-gradient(60% 50% at 18% 0%, var(--wash-hour-tint), transparent 70%);
  --wash: var(--wash-hour), linear-gradient(to bottom, var(--sky-top), var(--sky-bottom));

  --space-1: 2px;  --space-2: 4px;  --space-3: 8px;  --space-4: 12px; --space-5: 16px;
  --space-6: 20px; --space-7: 24px; --space-8: 32px; --space-9: 40px; --space-10: 48px; --space-11: 64px;
  --margin-content: 24px;  --gutter: 16px;  --pad-platter: 12px;
  --row-h: 28px;  --row-h-upnext: 36px;  --row-h-2line: 44px;
  --hit-min: 28px;  --hit-min-inspector: 24px;
  --measure-read: 620px;
  --margin-column: 220px;
  --sidebar-w: 220px;  --inspector-w: 320px;  --toolbar-h: 52px;

  --r-window: 20px;               /* prototype: the shell writes the real NSWindow radius */
  --r-platter: 18px;
  --r-tile: max(4px, calc(var(--r-platter) - var(--pad-platter)));
  --r-cell: var(--r-tile);
  --inset-floating: 12px;
  --r-floating: max(6px, calc(var(--r-window) - var(--inset-floating)));
  --r-control: 6px;  --r-control-sm: 5px;  --r-chip: 5px;
  --r-capsule: 999px;

  --shadow-ink: light-dark(rgb(0 0 0 / 0.08), rgb(0 0 0 / 0.55));
  --shadow-platter: var(--platter-border);
  --shadow-lift: 0 8px 24px var(--shadow-ink);

  --ease-spring: linear(0, 0.087, 0.258, 0.433, 0.584, 0.703, 0.793, 0.857, 0.903, 0.935, 0.956, 0.971, 0.981, 0.988, 0.992, 0.995, 1);
  --ease-spring-confirm: linear(0, 0.107, 0.315, 0.526, 0.698, 0.823, 0.906, 0.956, 0.985, 0.999, 1.005, 1.006, 1.006, 1.004, 1.003, 1.002, 1.001, 1.001, 1, 1, 1);
  --ease-fade: cubic-bezier(0.25, 0.1, 0.25, 1);
  --dur-fade: 200ms;
  --dur-nav: 500ms;
  --dur-confirm: 600ms;
  --dur-judge: 450ms;
  --dur-capture-close: 300ms;
}

/* ---------- 2. Prototype frame tokens (the simulated macOS around the app) ---------- */
:root{
  --desk-top:    light-dark(#DCE3EC, #1A202B);
  --desk-bottom: light-dark(#C3CDDA, #0D1118);
  --desk-bg: linear-gradient(170deg, var(--desk-top), var(--desk-bottom));
  --desk-ink:   light-dark(#1D1D1F, #EDEFF3);
  --desk-ink-2: light-dark(#454A53, #A9AEB9);
  /* Simulated native Liquid Glass — chrome only (toolbar, sidebar, inspector,
     menus, popovers, sheets, Quick Capture, widgets, menu bar, Control Center). */
  --glass:        color-mix(in oklab, var(--mat-chrome-fallback) 70%, transparent);
  --glass-strong: color-mix(in oklab, var(--mat-chrome-fallback) 84%, transparent);
  --glass-menu:   color-mix(in oklab, var(--mat-chrome-fallback) 80%, transparent);
  --glass-filter: blur(22px) saturate(1.6);
  --glass-edge:   light-dark(rgb(0 0 0 / 0.10), rgb(255 255 255 / 0.10));
  --glass-rim:    light-dark(rgb(255 255 255 / 0.70), rgb(255 255 255 / 0.07));
  --glass-shadow: 0 10px 30px light-dark(rgb(0 0 0 / 0.14), rgb(0 0 0 / 0.50)), 0 1px 3px light-dark(rgb(0 0 0 / 0.08), rgb(0 0 0 / 0.40));
  --glass-shadow-sm: 0 1px 3px light-dark(rgb(0 0 0 / 0.10), rgb(0 0 0 / 0.40));
  --window-shadow: 0 22px 70px light-dark(rgb(0 0 0 / 0.22), rgb(0 0 0 / 0.65)), 0 0 0 0.5px light-dark(rgb(0 0 0 / 0.16), rgb(255 255 255 / 0.12));
  --dim: light-dark(rgb(0 0 0 / 0.16), rgb(0 0 0 / 0.42));
  --tl-close: #FF5F57; --tl-min: #FEBC2E; --tl-zoom: #28C840;
  --seg-thumb: light-dark(#FFFFFF, rgb(255 255 255 / 0.18));
  --control-fill: color-mix(in oklab, var(--label) 7%, var(--mat-platter));
  --control-fill-hover: color-mix(in oklab, var(--label) 11%, var(--mat-platter));
  --menu-hl: var(--accent);
  --video-bg: #000000;
  --video-ink: #F2F2F4;
  --moon-lit:  light-dark(#FFFFFF, #E9EEF4);
  --moon-dark: light-dark(color-mix(in oklab, #1D1D1F 42%, #FFFFFF), color-mix(in oklab, #EDEFF3 13%, #141821));
  --moon-rim:  light-dark(#7A7A80, color-mix(in oklab, #EDEFF3 18%, #141821));
  --mansion-fav:   color-mix(in oklab, var(--label) 30%, var(--mat-platter));
  --mansion-mixed: color-mix(in oklab, var(--label) 15%, var(--mat-platter));
  --mansion-unfav: color-mix(in oklab, var(--label) 5%, var(--mat-platter));
  --tw-civil:    color-mix(in oklab, var(--label) 10%, var(--mat-platter));
  --tw-nautical: color-mix(in oklab, var(--label) 20%, var(--mat-platter));
  --tw-astro:    color-mix(in oklab, var(--label) 30%, var(--mat-platter));
  --tw-night:    color-mix(in oklab, var(--label) 40%, var(--mat-platter));
  --dial-day:    color-mix(in oklab, var(--label) 12%, var(--mat-platter));
  --dial-night:  color-mix(in oklab, var(--label) 34%, var(--mat-platter));
  --cell-now:    color-mix(in oklab, var(--hour-hue) 30%, var(--mat-platter));
  --paper-dusk: #23201A; --ink-dusk: #E6DDCB; --ink-2-dusk: #B3A994;
  --paper-lamp: #F1E6D0; --ink-lamp: #2A2217; --ink-2-lamp: #5E5140;
}
:root[data-sky="day"]{--sky-top:var(--sky-day-top);--sky-bottom:var(--sky-day-bottom)}
:root[data-hour="mars"]{--hour-hue:var(--planet-mars)}

/* ---------- 3. Base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{background:var(--desk-bg);color:var(--label);font:var(--type-body);-webkit-font-smoothing:antialiased;text-size-adjust:100%}
body{margin:0;background:var(--desk-bg);color:var(--label);min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:normal}
button{cursor:default;background:none;border:0;padding:0;margin:0}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}
ul,ol{padding:0;list-style:none}
svg{display:block}
.num{font-variant-numeric:var(--numeric-live)}
::selection{background:var(--selection)}
:focus-visible{outline:var(--focus-outline);outline-offset:var(--focus-offset)}
[data-figure] :focus-visible{outline:none}
[data-figure] .target:focus-visible .focus-ring,[data-figure] .target[aria-selected="true"] .focus-ring{stroke:var(--figure-ring-color);stroke-width:var(--figure-ring-width);fill:none}
[data-figure] .target[aria-selected="true"] .glyph{font-weight:var(--figure-selected-weight)}
[hidden]{display:none !important}
svg.fig-narrow .sec{display:none}
.sym{display:inline-block;width:1em;height:1em;vertical-align:-0.14em;flex:none;overflow:visible}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.l2{color:var(--label-2)} .l3{color:var(--label-3)}
.sub{font:var(--type-subheadline)} .foot{font:var(--type-footnote)} .callout{font:var(--type-callout)}
.emph{font-weight:600}
.ex{font:var(--type-footnote);color:var(--label-2);background:var(--fill);border-radius:var(--r-chip);padding:0 5px;margin-left:4px;white-space:nowrap;display:inline-block;vertical-align:1px;line-height:15px}
.g{font-family:var(--font-ui);font-weight:400}
.cell[data-planet="saturn"]{background:var(--tint-saturn)} .cell[data-planet="jupiter"]{background:var(--tint-jupiter)}
.cell[data-planet="mars"]{background:var(--tint-mars)} .cell[data-planet="sun"]{background:var(--tint-sun)}
.cell[data-planet="venus"]{background:var(--tint-venus)} .cell[data-planet="mercury"]{background:var(--tint-mercury)}
.cell[data-planet="moon"]{background:var(--tint-moon)}
.pc-saturn{color:var(--planet-saturn)} .pc-jupiter{color:var(--planet-jupiter)} .pc-mars{color:var(--planet-mars)}
.pc-sun{color:var(--planet-sun)} .pc-venus{color:var(--planet-venus)} .pc-mercury{color:var(--planet-mercury)} .pc-moon{color:var(--planet-moon)}
.halo{paint-order:stroke;stroke:var(--mat-platter);stroke-width:3px;stroke-linejoin:round}
.is-void{background:var(--tex-void);outline:var(--void-outline);outline-offset:-1px}
.season-closed{outline:var(--closed-outline);outline-offset:-1px}

/* ---------- 4. Frame: the macOS desktop, menu bar, window ---------- */
.screen{min-height:100vh;display:flex;flex-direction:column}
.menubar{position:sticky;top:0;z-index:60;height:28px;display:flex;align-items:center;gap:2px;
  padding-left:max(10px, env(safe-area-inset-left,0px));padding-right:max(10px, env(safe-area-inset-right,0px));
  background:color-mix(in oklab, var(--mat-chrome-fallback) 46%, transparent);backdrop-filter:var(--glass-filter);-webkit-backdrop-filter:var(--glass-filter);
  color:var(--desk-ink);font:500 13px/16px var(--font-ui);min-width:0}
.mb-item{height:22px;padding:0 9px;border-radius:5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.mb-item:hover,.mb-item[aria-expanded="true"]{background:var(--fill-2)}
.mb-item.app{font-weight:700}
.mb-apple svg{width:14px;height:16px}
.mb-menus{display:flex;align-items:center;gap:0;min-width:0;overflow:hidden}
.mb-spacer{flex:1;min-width:8px}
.mb-right{display:flex;align-items:center;gap:2px;flex:none}
.mb-extra svg{width:16px;height:16px}
.mb-clock{font-variant-numeric:tabular-nums}
.frame{flex:1;display:flex;flex-direction:column;align-items:center;gap:12px;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:20px 14px;min-width:0}
.footnote{font:var(--type-footnote);color:var(--desk-ink-2);text-align:center;max-width:860px;text-wrap:balance}

.win{position:relative;width:min(1360px,100%);height:min(860px, max(600px, calc(100vh - 92px)));border-radius:var(--r-window);
  background:var(--mat-window);box-shadow:var(--window-shadow);overflow:hidden;container:win / inline-size;isolation:isolate}
.win.wash{background:var(--wash)}
.win-grid{position:relative;display:grid;height:100%;grid-template-columns:calc(var(--sidebar-w) + 8px) minmax(0,1fr) auto;grid-template-rows:var(--toolbar-h) minmax(0,1fr);
  grid-template-areas:"side tool tool" "side content insp"}
.win.side-collapsed .win-grid{grid-template-columns:0 minmax(0,1fr) auto}
.win.side-collapsed .sidebar{display:none}

/* ---------- 5. Native chrome (simulated) ---------- */
.glass{background:var(--glass);backdrop-filter:var(--glass-filter);-webkit-backdrop-filter:var(--glass-filter)}
@media (prefers-reduced-transparency: reduce){
  .glass,.menubar,.tb-group,.menu,.sheet,.capture,.widget,.cc,.insp-wrap,.sidebar,.fl-ctl{backdrop-filter:none !important;-webkit-backdrop-filter:none !important;background:var(--mat-chrome-fallback) !important}
}

/* Traffic lights */
.traffic{display:flex;gap:8px;align-items:center;padding:0 2px}
.traffic i{width:12px;height:12px;border-radius:50%;display:block;box-shadow:inset 0 0 0 0.5px rgb(0 0 0 / 0.18)}
.traffic i:nth-child(1){background:var(--tl-close)} .traffic i:nth-child(2){background:var(--tl-min)} .traffic i:nth-child(3){background:var(--tl-zoom)}

/* Sidebar: floating glass pane, Music scale */
.sidebar{grid-area:side;margin:8px 0 8px 8px;border-radius:calc(var(--r-window) - 8px);display:flex;flex-direction:column;min-height:0;min-width:0;
  box-shadow:inset 0 0 0 0.5px var(--glass-edge), inset 0 1px 0 var(--glass-rim), var(--glass-shadow-sm);z-index:3}
.side-head{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 14px;flex:none}
.side-scroll{overflow:auto;padding:2px 8px 12px;flex:1;min-height:0}
.side-row{position:relative;display:flex;align-items:center;gap:8px;height:var(--row-h);padding:0 6px 0 8px;border-radius:7px;color:var(--label);width:100%;text-align:left;font:var(--type-body)}
.side-row:hover{background:var(--fill)}
.side-row[aria-current="page"]{background:var(--fill-2);font-weight:600}
.side-row .ic{width:16px;height:16px;color:var(--accent);flex:none}
.side-row .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-row.child{padding-left:30px}
.side-row .badge{font:600 11px/16px var(--font-ui);color:var(--label);background:var(--fill-2);border-radius:999px;padding:0 6px;font-variant-numeric:tabular-nums}
/* On the selected fill, secondary figures take primary ink (4.5:1). */
.side-row[aria-current="page"] .badge{color:var(--label);background:transparent;box-shadow:inset 0 0 0 1px var(--label-3)}
.disc{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;color:var(--label-2);flex:none}
.disc:hover{background:var(--fill-2)}
.disc svg{width:10px;height:10px;transition:transform var(--dur-fade) var(--ease-fade)}
.disc[aria-expanded="true"] svg{transform:rotate(90deg)}
.side-gap{height:6px}
.side-section{font:600 11px/14px var(--font-ui);color:var(--label-2);padding:10px 8px 4px}
.icon-btn{width:28px;height:28px;border-radius:999px;display:inline-grid;place-items:center;color:var(--label);flex:none}
.icon-btn:hover{background:var(--fill-2)}
.icon-btn svg{width:16px;height:16px}
.icon-btn[aria-pressed="true"]{background:var(--fill-2)}

/* Toolbar: unified, 52 pt, glass item groups */
.toolbar{grid-area:tool;display:flex;align-items:center;gap:8px;padding:0 10px 0 16px;min-width:0;z-index:4}
.tb-lead{display:none;align-items:center;gap:10px;flex:none}
.win.side-collapsed .tb-lead{display:flex}
.tb-title{display:flex;flex-direction:column;justify-content:center;min-width:0;flex:0 0 auto;max-width:300px;margin-right:6px}
.tb-title b{font:700 15px/18px var(--font-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title span{font:var(--type-subheadline);color:var(--label-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* A view drawn at its wireframe's own minute says so; the menu bar keeps now. */
.scene-tok{flex:none;font:var(--type-footnote);color:var(--label-2);border:1px solid var(--label-4);border-radius:999px;padding:1px 8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.cap-scene{margin:-4px 0 0;font:var(--type-footnote);color:var(--label-2);font-variant-numeric:tabular-nums}
.tb-center{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 auto;flex-wrap:nowrap;overflow:hidden;padding:6px 4px;margin:-6px -4px}
.tb-trail{display:flex;align-items:center;gap:8px;flex:none;margin-left:auto}
.tb-group{display:inline-flex;align-items:center;height:36px;padding:0 4px;border-radius:var(--r-capsule);gap:2px;flex:none;
  background:var(--glass);backdrop-filter:var(--glass-filter);-webkit-backdrop-filter:var(--glass-filter);box-shadow:inset 0 0 0 0.5px var(--glass-edge), inset 0 1px 0 var(--glass-rim), var(--glass-shadow-sm)}
.tb-btn{height:28px;min-width:28px;padding:0 8px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;color:var(--label)}
.tb-btn:hover{background:var(--fill-2)}
.tb-btn svg{width:16px;height:16px}
.tb-btn[aria-pressed="true"]{background:var(--fill-2)}
.tb-btn[disabled],.tb-btn[aria-disabled="true"]{color:var(--label-3)}
.tb-prominent{height:36px;padding:0 16px;border-radius:var(--r-capsule);display:inline-flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap;flex:none;
  color:var(--on-accent);background:color-mix(in oklab, var(--accent) 90%, transparent);backdrop-filter:var(--glass-filter);-webkit-backdrop-filter:var(--glass-filter);box-shadow:inset 0 1px 0 rgb(255 255 255 / 0.25), var(--glass-shadow-sm)}
.tb-prominent:hover{background:var(--accent)}
.tb-prominent svg{width:15px;height:15px}
.search{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:var(--r-capsule);width:180px;flex:none;
  background:var(--glass);backdrop-filter:var(--glass-filter);-webkit-backdrop-filter:var(--glass-filter);box-shadow:inset 0 0 0 0.5px var(--glass-edge), inset 0 1px 0 var(--glass-rim), var(--glass-shadow-sm);color:var(--label-2)}
.search.long{width:210px}
.search svg{width:14px;height:14px;flex:none}
.search input{border:0;background:transparent;outline:none;width:100%;min-width:0;color:var(--label);font:var(--type-body)}
.search input::placeholder{color:var(--label-3)}
.search:focus-within{outline:var(--focus-outline);outline-offset:var(--focus-offset)}

/* Segmented control (native) */
.seg{display:inline-flex;align-items:center;height:36px;padding:3px;border-radius:var(--r-capsule);gap:0;flex:none;
  background:var(--glass);backdrop-filter:var(--glass-filter);-webkit-backdrop-filter:var(--glass-filter);box-shadow:inset 0 0 0 0.5px var(--glass-edge), inset 0 1px 0 var(--glass-rim), var(--glass-shadow-sm)}
.seg button{height:30px;padding:0 12px;border-radius:var(--r-capsule);white-space:nowrap;color:var(--label);font:var(--type-body)}
.seg button:hover{background:var(--fill)}
.seg button[aria-pressed="true"]{background:var(--seg-thumb);font-weight:600;box-shadow:0 1px 2px light-dark(rgb(0 0 0 / 0.12), rgb(0 0 0 / 0.3))}
.seg.flat{background:var(--fill);backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none;height:30px;padding:2px}
.seg.flat button{height:26px;padding:0 10px}

/* Time control capsule */
.crown{display:inline-flex;align-items:center;height:36px;padding:0 4px;border-radius:var(--r-capsule);gap:2px;flex:none;
  background:var(--glass);backdrop-filter:var(--glass-filter);-webkit-backdrop-filter:var(--glass-filter);box-shadow:inset 0 0 0 0.5px var(--glass-edge), inset 0 1px 0 var(--glass-rim), var(--glass-shadow-sm)}
.crown .when{padding:0 6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.crown .notnow{font:600 11px/16px var(--font-ui);color:var(--label);border:1px solid var(--label-3);border-radius:999px;padding:0 6px;margin:0 2px;white-space:nowrap}
.crown .delta{font:var(--type-subheadline);color:var(--label-2);font-variant-numeric:tabular-nums;white-space:nowrap}

/* Popup button (native) */
.popup{height:28px;padding:0 6px 0 10px;border-radius:var(--r-control);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;background:var(--control-fill);color:var(--label);flex:none}
.popup:hover{background:var(--control-fill-hover)}
.popup svg{width:9px;height:12px;color:var(--label-2)}
.tb-label{font:var(--type-subheadline);color:var(--label-2);white-space:nowrap}
.field{height:28px;border-radius:var(--r-control);border:0;padding:0 10px;background:var(--control-fill);color:var(--label);min-width:0}
.field::placeholder{color:var(--label-3)}

/* Inspector: native, edge-to-edge glass, 320 pt */
.inspector{grid-area:insp;width:var(--inspector-w);min-height:0;display:flex;flex-direction:column;z-index:3}
.insp-wrap{height:100%;display:flex;flex-direction:column;min-height:0;background:var(--glass-strong);backdrop-filter:var(--glass-filter);-webkit-backdrop-filter:var(--glass-filter);
  box-shadow:inset 0.5px 0 0 var(--glass-edge)}
.insp-tabs{padding:10px 12px 8px;flex:none}
.insp-tabs .seg{width:100%;height:30px;padding:2px;background:var(--fill);backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none}
.insp-tabs .seg button{flex:1;height:26px;padding:0 4px;font:var(--type-callout)}
.insp-body{overflow:auto;padding:4px 16px 24px;flex:1;min-height:0}
.insp-sec{padding:10px 0;display:flex;flex-direction:column;gap:6px}
.insp-sec + .insp-sec{border-top:0.5px solid var(--separator-strong)}
.insp-h{font:600 11px/14px var(--font-ui);color:var(--label-2)}
.insp-title{font:700 15px/20px var(--font-ui);display:flex;align-items:center;gap:8px}
.insp-title .glyph{font-size:20px;font-weight:400}
.insp-title svg{width:18px;height:18px;flex:none;color:var(--accent)}
.insp-row{display:flex;gap:8px;align-items:baseline;justify-content:space-between;min-height:var(--hit-min-inspector)}
.insp-row > :first-child{min-width:0}
.insp-p{font:var(--type-body);color:var(--label);text-wrap:pretty}
.insp-p.l2{color:var(--label-2)}
.insp-btn{min-height:24px;padding:3px 10px;border-radius:var(--r-control);background:var(--fill-2);text-align:center;font:var(--type-body)}
.insp-btn:hover{background:color-mix(in oklab, var(--label) 14%, transparent)}
.kbd{font:var(--type-subheadline);color:var(--label-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.insp-empty{color:var(--label-2);padding:16px 0}

/* Menus, popovers, help tags */
.menu{position:fixed;z-index:90;min-width:220px;max-width:min(360px, calc(100vw - 24px));padding:5px;border-radius:12px;background:var(--glass-menu);backdrop-filter:var(--glass-filter);-webkit-backdrop-filter:var(--glass-filter);
  box-shadow:inset 0 0 0 0.5px var(--glass-edge), inset 0 1px 0 var(--glass-rim), var(--glass-shadow);font:var(--type-body);color:var(--label)}
.menu.enter{animation:menuIn 160ms var(--ease-fade)}
@keyframes menuIn{from{opacity:0;transform:translateY(-3px)}}
.mi{display:flex;align-items:center;gap:10px;width:100%;min-height:24px;padding:3px 10px;border-radius:6px;text-align:left;white-space:nowrap}
.mi .mk{width:12px;flex:none;color:inherit;text-align:center}
.mi .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.mi .sc{color:var(--label-2);font-variant-numeric:tabular-nums;margin-left:18px}
.mi:not([disabled]):hover,.mi:not([disabled]):focus-visible{background:var(--menu-hl);color:var(--on-accent);outline:none}
.mi:not([disabled]):hover .sc,.mi:not([disabled]):focus-visible .sc{color:inherit}
.mi[disabled]{color:var(--label-3)}
.mi.info{white-space:normal;color:var(--label);font:var(--type-body)}
.mi.info:hover{background:none;color:var(--label)}
.msep{height:1px;margin:5px 10px;background:var(--separator-strong)}
.mhead{padding:8px 10px 6px}
.menu.extra{width:410px;max-width:calc(100vw - 24px)}
.menu.extra .mi.info .t{white-space:nowrap}
.mrow-info{padding:2px 10px;min-height:22px;display:flex;align-items:center;white-space:normal}
.popover{position:fixed;z-index:85;width:300px;max-width:calc(100vw - 24px);padding:12px;border-radius:14px;background:var(--glass-menu);backdrop-filter:var(--glass-filter);-webkit-backdrop-filter:var(--glass-filter);
  box-shadow:inset 0 0 0 0.5px var(--glass-edge), inset 0 1px 0 var(--glass-rim), var(--glass-shadow)}
.popover h3{font:var(--type-headline);margin-bottom:8px}
.check{display:flex;align-items:center;gap:8px;min-height:24px;cursor:default}
.check input{appearance:none;-webkit-appearance:none;width:14px;height:14px;border-radius:4px;margin:0;background:var(--control-fill);box-shadow:inset 0 0 0 0.5px var(--separator-strong);display:grid;place-items:center;flex:none}
.check input:checked{background:var(--accent);box-shadow:none}
.check input:checked::after{content:"";width:7px;height:4px;border-left:1.6px solid var(--on-accent);border-bottom:1.6px solid var(--on-accent);transform:translateY(-1px) rotate(-45deg)}
.check input:focus-visible{outline:var(--focus-outline);outline-offset:var(--focus-offset)}
.helptag{position:fixed;z-index:95;pointer-events:none;padding:4px 8px;border-radius:7px;background:var(--glass-menu);backdrop-filter:var(--glass-filter);-webkit-backdrop-filter:var(--glass-filter);
  box-shadow:inset 0 0 0 0.5px var(--glass-edge), var(--glass-shadow);font:var(--type-subheadline);white-space:nowrap;font-variant-numeric:tabular-nums}

/* Sheet (SwiftUI form sheet) */
.dimmer{position:absolute;inset:0;background:var(--dim);z-index:20;display:flex;justify-content:center;align-items:flex-start;padding:64px 16px 16px}
.dimmer.enter{animation:fadeIn var(--dur-fade) var(--ease-fade)}
@keyframes fadeIn{from{opacity:0}}
.sheet{width:min(500px,100%);max-height:calc(100% - 24px);overflow:auto;border-radius:22px;padding:20px 20px 16px;background:var(--glass-strong);backdrop-filter:var(--glass-filter);-webkit-backdrop-filter:var(--glass-filter);
  box-shadow:inset 0 0 0 0.5px var(--glass-edge), inset 0 1px 0 var(--glass-rim), var(--glass-shadow)}
.dimmer.enter .sheet{animation:sheetIn var(--dur-nav) var(--ease-spring)}
@keyframes sheetIn{from{transform:translateY(-14px);opacity:0}}
.sheet h2{font:700 15px/20px var(--font-ui)}
.sheet .sh-sub{color:var(--label-2);margin-top:2px}
.form-group{margin-top:14px;border-radius:12px;background:var(--fill);padding:2px 12px}
.form-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:8px 0;min-height:32px}
.form-row + .form-row{border-top:0.5px solid var(--separator-strong)}
.form-row > span:first-child{color:var(--label);flex:none}
.form-row > .v{text-align:right;color:var(--label-2);min-width:0}
.sheet-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn{min-height:28px;padding:4px 14px;border-radius:var(--r-capsule);background:var(--control-fill);color:var(--label);white-space:nowrap;font:var(--type-body);display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--control-fill-hover)}
.btn.default{background:var(--accent);color:var(--on-accent);font-weight:600}
.btn.default:hover{background:color-mix(in oklab, var(--accent) 88%, var(--label))}
.btn .kbd{color:inherit;opacity:1}
.btn.sm{min-height:24px;padding:2px 10px}

/* Quick Capture panel (non-activating NSPanel, 440 × 132) */
.capture-wrap{position:fixed;inset:0;z-index:80;display:flex;justify-content:center;align-items:flex-start;padding:16vh 16px 0;pointer-events:none}
.capture{pointer-events:auto;width:min(440px,100%);min-height:132px;border-radius:22px;padding:14px 16px 12px;display:flex;flex-direction:column;gap:10px;justify-content:center;
  background:var(--glass-strong);backdrop-filter:var(--glass-filter);-webkit-backdrop-filter:var(--glass-filter);box-shadow:inset 0 0 0 0.5px var(--glass-edge), inset 0 1px 0 var(--glass-rim), var(--glass-shadow)}
.capture.enter{animation:capIn 180ms var(--ease-spring)}
.capture.leave{animation:capOut var(--dur-capture-close) var(--ease-spring) forwards}
@keyframes capIn{from{opacity:0;transform:scale(.97)}}
@keyframes capOut{to{opacity:0;transform:scale(.97) translateY(-6px)}}
.cap-row{display:flex;align-items:center;gap:8px;min-width:0}
.cap-row input[type=text]{flex:1;min-width:0;border:0;outline:none;background:transparent;font:400 17px/22px var(--font-ui);color:var(--label);padding:4px 0}
.cap-row input[type=text]:focus-visible{outline:none}
.cap-row:focus-within .cap-field{box-shadow:0 0 0 3px color-mix(in oklab, var(--accent) 45%, transparent)}
.cap-field{flex:1;min-width:0;display:flex;border-radius:8px;padding:0 6px}
.cap-stamp{flex:1;min-width:0;font:var(--type-subheadline);color:var(--label-2);font-variant-numeric:tabular-nums}

/* ---------- 6. Components ---------- */
.content{grid-area:content;overflow:auto;min-width:0;min-height:0;padding:6px var(--margin-content) 32px;position:relative;scroll-padding-top:8px;container:content / inline-size}
.content:focus,.content:focus-visible{outline:none}
.view.enter{animation:viewIn var(--dur-nav) var(--ease-spring)}
@keyframes viewIn{from{opacity:0;transform:translateY(5px)}}
.platter{background:var(--mat-platter);border-radius:var(--r-platter);padding:var(--pad-platter);box-shadow:var(--shadow-platter);min-width:0}
.platter.raised{background:var(--mat-raised)}
.ph{font:600 13px/16px var(--font-ui);color:var(--label-2);display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;min-height:20px}
.stack{display:flex;flex-direction:column;gap:var(--gutter);min-width:0}
.row{display:flex;gap:8px;align-items:center;min-width:0}
.wrap{flex-wrap:wrap}
.spacer{flex:1}
.link{color:var(--accent);text-decoration:none;border-radius:4px}
.link:hover{text-decoration:underline}
button.link{font:inherit}
.chev{color:var(--label-3);flex:none;width:14px;text-align:center}
.cbtn{min-height:28px;padding:3px 12px;border-radius:var(--r-control);background:var(--control-fill);white-space:nowrap;font:var(--type-body);flex:none;display:inline-flex;align-items:center;gap:6px}
.cbtn:hover{background:var(--control-fill-hover)}
.cbtn.default{background:var(--accent);color:var(--on-accent);font-weight:600}
.cbtn.sm{min-height:24px;padding:2px 9px;font:var(--type-callout)}
.cbtn svg{width:14px;height:14px}
.caution-ic{display:inline-block;width:13px;height:13px;vertical-align:-2px;color:var(--state-caution-ink)}

/* Provenance chips */
.chip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;border-radius:var(--r-chip);background:var(--provenance-fill);color:var(--provenance-ink);font:var(--type-subheadline);white-space:nowrap;vertical-align:middle;max-width:100%}
.chip svg{width:11px;height:11px;flex:none}
.chip.unsourced{font-style:italic;background:transparent;box-shadow:inset 0 0 0 1px var(--label-3);outline:1px dashed var(--label-3);outline-offset:-1px;box-shadow:none}
.chip span{overflow:hidden;text-overflow:ellipsis}

.widget .ex{font-size:11px;line-height:15px}

/* Up Next rows */
.un{display:flex;flex-direction:column}
.un-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;column-gap:10px;min-height:var(--row-h-upnext);padding:6px 4px;border-radius:8px}
.un-row + .un-row{margin-top:2px}
.un-row:focus-visible{outline:var(--focus-outline)}
.un-t{font:var(--type-body);color:var(--label-2);font-variant-numeric:tabular-nums;white-space:nowrap;align-self:start;padding-top:1px}
.un-x{min-width:0;font:var(--type-body);text-wrap:pretty}
.un-x .g{margin-right:4px}
.un-x .s2{display:block;color:var(--label-2);font:var(--type-callout);margin-top:1px}
.un-row.adv .un-x{color:var(--label-2)}
.un-v{display:flex;gap:6px;align-items:center;justify-self:end}
.un-sub{font:600 12px/15px var(--font-ui);color:var(--label-2);padding:12px 4px 4px}
.un-row.judge{grid-template-columns:minmax(0,1fr);row-gap:6px}
.verdicts{display:flex;gap:6px;flex-wrap:wrap}
.recorded{display:flex;align-items:center;gap:8px;color:var(--label);font:var(--type-body)}
.recorded .mark{font-size:14px}
.chk-draw{stroke-dasharray:20;stroke-dashoffset:0;animation:drawOn var(--dur-judge) var(--ease-spring)}
@keyframes drawOn{from{stroke-dashoffset:20}}

/* Hour Ribbon */
.ribbon-scroll{overflow-x:auto;overflow-y:visible;min-width:0;padding-bottom:2px}
.ribbon{position:relative;min-width:560px;user-select:none;-webkit-user-select:none;padding:6px 0}
.rb-cells{position:relative;height:40px}
.rb-cell{position:absolute;top:0;bottom:0;display:grid;place-items:center;font:400 17px/1 var(--font-ui);border-radius:5px;padding:0}
.rb-cell.now{background:var(--cell-now);font-weight:700}
.rb-cell[aria-selected="true"]{box-shadow:inset 0 0 0 var(--figure-ring-width) var(--figure-ring-color);font-weight:700}
.rb-cell:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--figure-ring-color)}
.rb-cell .pin{position:absolute;top:2px;right:3px;width:10px;height:10px;color:var(--label)}
.rb-cell .pin svg{width:10px;height:10px}
.rb-cell .step{position:absolute;bottom:3px;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:6px solid var(--label)}
/* The gilt now-needle is drawn as ticks above and below the cell, so the current ruler's glyph is never struck. */
.rb-needle{position:absolute;top:-6px;bottom:-6px;width:2px;margin-left:-1px;pointer-events:none;z-index:2}
.rb-needle::before,.rb-needle::after{content:"";position:absolute;left:0;width:2px;height:10px;border-radius:1px;background:var(--now-needle)}
.rb-needle::before{top:0} .rb-needle::after{bottom:0}
.rb-tw{position:relative;height:4px;margin-top:3px}
.rb-tw i{position:absolute;top:0;bottom:0}
.rb-ticks{position:relative;height:16px;margin-top:3px}
.rb-ticks i{position:absolute;top:0;width:1px;height:5px;background:var(--label-4)}
.rb-ticks b{position:absolute;top:5px;font:400 10px/11px var(--font-ui);color:var(--label-2);transform:translateX(-50%);font-variant-numeric:tabular-nums}
.rb-labels{position:relative;height:16px;font:var(--type-footnote);color:var(--label-2);font-variant-numeric:tabular-nums}
.rb-labels span{position:absolute;top:0;white-space:nowrap;transform:translateX(-50%)}
.rb-labels span.l{transform:none} .rb-labels span.r{transform:translateX(-100%)}

/* Testimonies scales */
.dw{position:relative;display:block;height:18px;min-width:0}
.dw svg{display:block;width:100%;height:18px;overflow:visible}
.dw-dot{position:absolute;top:50%;width:9px;height:9px;border-radius:50%;background:var(--label);box-shadow:inset 0 0 0 1.3px var(--label);transform:translate(-50%,-50%)}
.dw-dot.hollow{background:var(--mat-platter)}
.testi{display:grid;grid-template-columns:auto minmax(60px,1fr) auto;align-items:center;column-gap:10px;row-gap:6px}
.testi .tl{font:var(--type-body);white-space:nowrap}
.testi .tv{font:var(--type-body);font-variant-numeric:tabular-nums;text-align:right}
.testi svg{width:100%;height:12px;overflow:visible}

/* Stage track */
.stages{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(78px,1fr);align-items:start;position:relative;overflow-x:auto;padding-bottom:4px}
.stg{display:flex;flex-direction:column;align-items:flex-start;gap:4px;position:relative;min-width:0;padding-right:8px}
.stg .sn{font:600 13px/16px var(--font-ui)}
.stg .sd{font:var(--type-subheadline);color:var(--label-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.stg .dotline{display:flex;align-items:center;width:100%;height:14px}
.stg .dotline svg{width:14px;height:14px;flex:none}
.stg .dotline i{flex:1;height:1px;background:var(--label-3);margin-left:4px}
.stg:last-child .dotline i{display:none}
.stg.cur .sn{color:var(--label)}

/* Tables (ephemeris, library) */
.tbl-scroll{overflow-x:auto;min-width:0}
table.tbl{border-collapse:collapse;width:100%;font:var(--type-body)}
.tbl th{font:600 11px/14px var(--font-ui);color:var(--label-2);text-align:left;padding:6px 10px 6px 0;white-space:nowrap;position:sticky;top:0;background:var(--mat-platter)}
.tbl td{padding:7px 10px 7px 0;vertical-align:baseline}
.tbl th:first-child,.tbl td:first-child{padding-left:8px}
.tbl tbody tr:nth-child(even) td{background:var(--fill)}
.tbl td:first-child{border-radius:6px 0 0 6px} .tbl td:last-child{border-radius:0 6px 6px 0}
/* Lines inside content only under Increase Contrast or Show Borders (§4.3). */
:root[data-show-borders] .tbl td,:root[data-increase-contrast] .tbl td{border-top:0.5px solid var(--separator-strong)}
@media (prefers-contrast: more){.tbl td{border-top:0.5px solid var(--separator-strong)} .materia-row + .materia-row{box-shadow:0 -0.5px 0 var(--separator-strong)}}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr[aria-selected="true"] td{background:var(--fill-2)}
.mono{font:var(--type-mono)}

/* ---------- 7. Views ---------- */
/* Today (W1) */
.today{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.28fr);grid-template-areas:"day day day" "pair pair next" "ribbon ribbon ribbon";gap:var(--gutter);align-items:start;padding-top:10px}
/* Hour and Moon share one height; Up Next keeps its own. */
.t-pair{grid-area:pair;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--gutter);align-items:stretch;min-width:0}
.t-hour{container:hourp / inline-size}
.t-moon{display:flex;flex-direction:column}
.t-moon .moon-wrap{flex:1;align-content:center}
.t-day{grid-area:day;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:24px;row-gap:6px;align-items:baseline;padding:4px 4px 6px}
.t-day h1{font:var(--type-large-title)}
.t-day .sent{font:var(--type-title-3);max-width:640px;text-wrap:pretty}
.t-day .side{text-align:right;color:var(--label-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.t-next{grid-area:next} .t-ribbon{grid-area:ribbon}
.dial-wrap{display:grid;place-items:center;padding:6px 0 10px}
.dial-wrap > svg{width:min(196px,100%);height:auto}
.hour-name{font:var(--type-display-m);letter-spacing:0}
.hour-left{font:var(--type-title-2);margin-top:2px}
@container hourp (max-width: 290px){.hour-name{font:var(--type-display-s)}}
.facts{font:var(--type-body);color:var(--label);margin-top:8px;text-wrap:pretty}
.facts.l2{color:var(--label-2);margin-top:4px}
.moon-wrap{display:grid;place-items:center;padding:6px 0 10px}
.moon-wrap > svg{width:min(150px,80%);height:auto}
.mline{font:var(--type-title-3);text-wrap:pretty}

/* Sky (W2) */
.sky-now{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:var(--gutter);align-items:start;padding-top:8px}
.astro-fig{position:relative;min-width:0}
#astrolabe{width:100%;max-width:620px;height:auto;margin:0 auto;touch-action:none;cursor:grab}
.wheel-wrap svg{width:100%;height:auto}
.lens{display:flex;align-items:center;gap:8px;margin-top:6px;color:var(--label-2)}
.comps{display:flex;flex-direction:column;gap:10px;min-width:0}
.comp{background:var(--mat-platter);border-radius:var(--r-platter);padding:10px 12px;min-width:0}
.comp .ch{font:600 11px/14px var(--font-ui);color:var(--label-2);margin-bottom:3px}
.comp .cv{font:var(--type-body);text-wrap:pretty}
.comp .big{font:var(--type-display-s);display:flex;align-items:baseline;gap:8px}
.comp .big small{font:var(--type-title-3)}
.itin{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px;font:var(--type-body)}
.capsule{display:inline-flex;align-items:center;gap:5px;border-radius:999px;background:var(--mat-platter);white-space:nowrap;font-variant-numeric:tabular-nums}
.capsule.void{background:var(--tex-void), var(--mat-platter);outline:var(--void-outline);outline-offset:-1px}
.itin .arr{color:var(--label-3)}
.capsule.ghost{background:transparent;color:var(--label-2);box-shadow:inset 0 0 0 1px var(--label-4)}
.notnow-tag{font:600 11px/16px var(--font-ui);color:var(--label);border:1px solid var(--label-3);border-radius:999px;padding:0 6px;white-space:nowrap}
.capsule .vt{background:var(--mat-platter);border-radius:4px;padding:0 4px}
.sky-bottom{grid-column:1 / -1;display:flex;flex-direction:column;gap:6px;min-width:0}
.atlas{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--gutter);padding-top:10px}
.atlas .platter h3{font:var(--type-title-3);font-weight:600;margin-bottom:4px}
.day-h{font:600 12px/15px var(--font-ui);color:var(--label-2);padding:14px 0 4px;position:sticky;top:-6px;background:var(--mat-platter);z-index:1}

/* Calendar (W3) */
.cal{display:flex;flex-direction:column;gap:10px;padding-top:6px;min-width:0}
.tymp{display:grid;grid-template-columns:repeat(30,minmax(22px,1fr));min-width:690px;font:var(--type-footnote);color:var(--label-2);font-variant-numeric:tabular-nums;row-gap:2px}
.tymp div{text-align:center;white-space:nowrap}
.tymp .hinge{color:var(--label);font-weight:600}
.month-scroll{overflow-x:auto;min-width:0}
.month{min-width:640px;display:flex;flex-direction:column;gap:6px}
.wkdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;font:600 11px/14px var(--font-ui);color:var(--label-2);padding:0 2px;position:sticky;top:0}
.week{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dc{position:relative;min-height:92px;border-radius:var(--r-cell);padding:6px 7px 22px;display:flex;flex-direction:column;gap:2px;text-align:left;min-width:0;font:var(--type-callout);background:var(--mat-platter)}
.dc .dn{display:flex;justify-content:space-between;align-items:baseline;font:600 13px/16px var(--font-ui)}
.dc .dn .g{font-weight:400;font-size:13px}
.dc .ev{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.dc .ev.c{font-weight:600}
.dc[aria-selected="true"]{box-shadow:inset 0 0 0 var(--figure-ring-width) var(--figure-ring-color)}
.dc.blank{background:transparent}
.dc .q{position:absolute;right:7px;bottom:6px;display:flex;gap:2px;align-items:flex-end}
.dc .q i{width:4px;height:10px;border-radius:1px;background:var(--label)}
.dc .q i.o{background:transparent;box-shadow:inset 0 0 0 1px var(--label-3)}
.dc .marks{position:absolute;left:7px;bottom:5px;display:flex;gap:6px;align-items:center;font:var(--type-callout)}
.span-bar{position:absolute;height:16px;border-radius:4px;font:var(--type-footnote);color:var(--label);display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;pointer-events:none;padding:0 4px;font-variant-numeric:tabular-nums}
.span-bar.void{background:var(--tex-void), var(--mat-platter);outline:var(--void-outline);outline-offset:-1px}
.span-bar.void span{background:var(--mat-platter);padding:0 3px;border-radius:3px}
.season-note{font:var(--type-footnote);color:var(--label-2);display:flex;align-items:center;gap:6px}
.season-note i{display:inline-block;width:28px;height:10px;border-radius:3px;outline:var(--closed-outline);outline-offset:-1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font:var(--type-footnote);color:var(--label-2);padding:4px 2px}
.legend span{display:inline-flex;align-items:center;gap:5px}

/* Find a Time (W3b) */
.fat{display:flex;flex-direction:column;gap:12px;padding-top:6px}
.fat-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.seasons svg{width:100%;height:46px}
.res{display:flex;flex-direction:column}
.res-row{display:grid;grid-template-columns:18px minmax(0,1fr) auto;column-gap:8px;padding:8px 10px;border-radius:10px;text-align:left;width:100%;align-items:start}
.res-row:hover{background:var(--fill)}
.res-row[aria-selected="true"]{background:var(--fill-2)}
.res-row .rt{font:var(--type-body);font-variant-numeric:tabular-nums}
.res-row .rs{font:var(--type-callout);color:var(--label-2);margin-top:2px;text-wrap:pretty}
.res-row .score{color:var(--label-2)}
.res-row .mk{font-size:13px;line-height:16px}
.res-row.now-row{margin-bottom:8px}
.res-row .cm{color:var(--label-2)}
.mini-month{display:grid;grid-template-columns:repeat(7,32px);gap:2px;font:var(--type-callout);text-align:center;font-variant-numeric:tabular-nums}
.mini-month b{font:600 10px/16px var(--font-ui);color:var(--label-2)}
.mini-month span{height:26px;display:grid;place-items:center;border-radius:6px}
.mini-month span.sel{box-shadow:inset 0 0 0 1.5px var(--label);font-weight:700}
.mini-month span.has{font-weight:600}

/* Charts (W4) */
.chart-doc{display:flex;flex-direction:column;gap:12px;padding-top:6px}
.q-title{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.q-title h1{font:var(--type-title-1);font-weight:600}
.cons{display:flex;flex-direction:column;gap:6px}
.con{display:grid;grid-template-columns:18px minmax(0,1fr);column-gap:6px;align-items:start}
.con .ck{font-weight:600}
.chart-pair{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:var(--gutter);align-items:start}
.chart-pair .platter > svg{width:100%;height:auto}
.sig{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:10px;row-gap:8px}
.sig dt{color:var(--label-2)}
.sig dd{margin:0}
.perf{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:12px;row-gap:8px;align-items:center}
.pf{display:flex;align-items:flex-end;gap:6px;max-width:440px;padding-top:16px;min-width:0}
.pf-g{font:400 15px/18px var(--font-ui);flex:none}
.pf-g.b{font-weight:700}
.pf-lab{font:var(--type-footnote);color:var(--label-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.pf-sep{position:relative;flex:0 1 92px;min-width:62px;border-top:1px dashed var(--label-2);margin-bottom:8px}
.pf-sep .pf-lab{position:absolute;left:50%;bottom:3px;transform:translateX(-50%)}
.pf-arc{position:relative;flex:1 1 220px;min-width:120px;height:24px;border:1.4px solid var(--label);border-bottom:0;border-radius:50% 50% 0 0 / 100% 100% 0 0;margin-bottom:6px}
.pf-arc::after{content:"";position:absolute;right:-4.7px;bottom:-3px;border-left:4px solid transparent;border-right:4px solid transparent;border-top:6px solid var(--label)}
.pf-arc .pf-lab{position:absolute;left:50%;top:7px;transform:translateX(-50%)}

/* Works (W5) */
.works{display:flex;flex-direction:column;gap:12px;padding-top:6px}
.design-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--gutter)}
.kamea > svg{width:100%;max-width:260px;height:auto}
.mat-list{display:flex;flex-direction:column;gap:6px}
.drop{border-radius:10px;outline:1px dashed var(--label-3);outline-offset:-1px;padding:10px;color:var(--label-2);text-align:center;font:var(--type-callout)}
.plan li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;column-gap:6px;align-items:baseline;padding:4px 0}
.plan li .n{color:var(--label-2);font-variant-numeric:tabular-nums}
.safety{display:flex;flex-direction:column;gap:4px}
.safety p{display:grid;grid-template-columns:16px minmax(0,1fr);gap:6px}

/* Court (W6) */
.court{display:grid;grid-template-columns:minmax(0,290px) minmax(0,1fr);gap:var(--gutter);padding-top:6px;align-items:start}
.court-list .grp{font:600 12px/15px var(--font-ui);color:var(--label-2);padding:10px 8px 4px}
.court-list .it{display:block;width:100%;text-align:left;padding:6px 8px;border-radius:8px}
.court-list .it:hover{background:var(--fill)}
.court-list .it[aria-current="true"]{background:var(--fill-2)}
.member h2{font:var(--type-title-2);font-weight:600}
.loglist{display:flex;flex-direction:column;gap:8px}
.log{display:grid;grid-template-columns:76px minmax(0,1fr) auto;column-gap:10px;align-items:baseline}
.log.resp{grid-template-columns:76px minmax(0,1fr)}
.log .k{color:var(--label-2)}

/* Record (W7) */
.rec{display:flex;flex-direction:column;gap:12px;padding-top:6px}
.scope{display:flex;flex-wrap:wrap;gap:6px}
.scope button{height:26px;padding:0 10px;border-radius:999px;background:var(--fill);font:var(--type-callout);white-space:nowrap}
.scope button[aria-pressed="true"]{background:var(--label);color:var(--mat-platter);font-weight:600}
.entry{display:grid;grid-template-columns:132px minmax(0,1fr) auto;column-gap:12px;padding:10px 8px;border-radius:10px;text-align:left;width:100%;align-items:start}
.entry:hover{background:var(--fill)}
.entry[aria-selected="true"]{background:var(--fill-2)}
.entry .et{font-variant-numeric:tabular-nums;color:var(--label-2)}
.km svg{display:inline-block;width:14px;height:14px;vertical-align:-2px;color:var(--label-2)}
.entry .stamp{display:block;margin-top:3px;color:var(--label-2);font:var(--type-callout);font-variant-numeric:tabular-nums}
.entry.new{animation:viewIn var(--dur-nav) var(--ease-spring)}
.rbc{display:grid;grid-template-columns:minmax(120px,190px) minmax(140px,1fr) auto;column-gap:14px;row-gap:4px;align-items:center}
.rbc svg{width:100%;height:18px;overflow:visible}
.rbc .grp{grid-column:1/-1;font:600 12px/15px var(--font-ui);color:var(--label-2);padding-top:10px}

/* Library (W8) */
.lib{display:flex;flex-direction:column;gap:12px;padding-top:6px}
.lib-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;color:var(--label-2)}
.lib-head b{color:var(--label);font-weight:600}
.shelf{display:grid;grid-template-columns:20px 16px minmax(0,1fr) auto;column-gap:6px;align-items:center;min-height:28px;padding:2px 6px;border-radius:7px;width:100%;text-align:left}
.shelf:hover{background:var(--fill)}
.shelf.sub{padding-left:0}
.subshelves{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:0 8px;padding:2px 0 8px 46px}
.subshelves .shelf{grid-template-columns:16px minmax(0,1fr) auto;font:var(--type-body)}
.shelf .ic{width:16px;height:16px;color:var(--accent)}
.shelf .st{color:var(--label-2);font:var(--type-callout);white-space:nowrap}
.cloud{display:inline-flex;align-items:center;gap:5px;color:var(--label-2);font:var(--type-callout);white-space:nowrap}
.cloud svg{width:14px;height:14px}
.covers{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:var(--gutter)}
.cover{aspect-ratio:3/4;border-radius:8px;background:var(--mat-paper);color:var(--ink);padding:12px 10px;display:flex;flex-direction:column;justify-content:space-between;font:500 14px/18px var(--font-read);text-align:left;box-shadow:var(--shadow-platter)}
.cover small{font:var(--type-footnote);color:var(--ink-2);font-family:var(--font-ui)}
.health{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:var(--gutter)}
.health dl{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;row-gap:4px}
.health dt{color:var(--label)} .health dd{margin:0;text-align:right;color:var(--label-2);font-variant-numeric:tabular-nums}
.materia-list{display:flex;flex-direction:column;gap:2px}
.materia-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:8px 10px;border-radius:10px;cursor:default}
.materia-row:hover{background:var(--fill)}
.materia-row[aria-selected="true"]{background:var(--fill-2)}

/* Reader (edition) */
.reader{display:grid;grid-template-columns:minmax(0,var(--measure-read)) var(--margin-column);gap:32px;justify-content:center;padding:18px 0 40px}
.page{background:var(--mat-paper);color:var(--ink);border-radius:var(--r-platter);padding:28px 40px 24px;min-width:0}
.page.dusk{background:var(--paper-dusk);color:var(--ink-dusk);--ink-2:var(--ink-2-dusk)}
.page.lamp{background:var(--paper-lamp);color:var(--ink-lamp);--ink-2:var(--ink-2-lamp)}
.runhead{display:flex;justify-content:space-between;gap:12px;font:var(--type-footnote);color:var(--ink-2);font-family:var(--font-ui);margin-bottom:22px;font-variant-numeric:tabular-nums}
.page h1{font:var(--type-read-title);margin-bottom:6px;text-wrap:balance}
.page .rubric{font:var(--type-rubric);color:var(--ink-2);margin-bottom:18px}
.page p.ed{font:var(--type-read);font-variant-numeric:var(--numeric-prose);text-wrap:pretty;hanging-punctuation:first last;margin-bottom:14px;hyphens:manual}
.page p.ed mark{background:color-mix(in oklab, var(--accent-gilt) 26%, transparent);color:inherit;border-radius:2px}
.folio{text-align:center;font:var(--type-footnote);color:var(--ink-2);margin-top:18px;font-variant-numeric:var(--numeric-prose)}
.margin{display:flex;flex-direction:column;gap:14px;padding-top:58px;min-width:0}
.mnote{font:var(--type-margin-note);color:var(--label-2);display:flex;flex-direction:column;gap:4px;align-items:flex-start}

/* Lesson Player (W10) */
.lesson{display:flex;flex-direction:column;gap:12px;padding-top:6px}
.video{position:relative;aspect-ratio:16/9;background:var(--video-bg);border-radius:14px;overflow:hidden;color:var(--video-ink);display:grid;place-items:center;min-width:0}
.video .ph-t{font:var(--type-callout);color:#A7A7AD;text-align:center;padding:0 16px}
.avbar{position:absolute;left:12px;right:12px;bottom:12px;height:40px;border-radius:999px;display:flex;align-items:center;gap:10px;padding:0 14px;
  background:rgb(40 40 44 / 0.55);backdrop-filter:var(--glass-filter);-webkit-backdrop-filter:var(--glass-filter);color:#F2F2F4;font:var(--type-callout);font-variant-numeric:tabular-nums}
.avbar svg{width:16px;height:16px}
.scrub{position:relative;flex:1;height:4px;border-radius:2px;background:rgb(255 255 255 / 0.28);min-width:40px}
.scrub b{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:#F2F2F4}
.scrub i{position:absolute;top:-3px;width:1.5px;height:10px;background:rgb(255 255 255 / 0.6)}
.scrub u{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:#FFFFFF;transform:translate(-50%,-50%)}
.transcript{background:var(--mat-paper);color:var(--ink);border-radius:var(--r-platter);padding:14px 18px}
.tline{display:grid;grid-template-columns:52px minmax(0,1fr);column-gap:10px;padding:5px 8px;border-radius:8px;font:var(--type-transcript);width:100%;text-align:left;color:var(--ink-2)}
.tline .ts{font:var(--type-callout);font-variant-numeric:tabular-nums;color:var(--ink-2);padding-top:3px}
.tline.cur{color:var(--ink);box-shadow:inset 3px 0 0 var(--accent-gilt);background:color-mix(in oklab, var(--accent-gilt) 9%, transparent)}
.outline-row{display:grid;grid-template-columns:18px minmax(0,1fr) auto;column-gap:6px;align-items:center;min-height:28px;padding:0 8px;border-radius:7px;width:100%;text-align:left}
.outline-row[aria-current="true"]{background:var(--fill-2);font-weight:600}
.outline-row[aria-current="true"] .l2{color:var(--label)}
.outline-row .ol-dot{display:none}
.quote-card{border-radius:12px;background:var(--fill);padding:10px 12px;display:flex;flex-direction:column;gap:6px}

/* Altar (W9) */
.altar{position:fixed;inset:0;z-index:70;background:var(--wash);color:var(--label);overflow:auto;
  padding:max(28px, env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) calc(72px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}

const symSVG = (k, label = '') => `<svg class="sym" viewBox="0 0 16 16" ${label ? `role="img" aria-label="${label}"` : 'aria-hidden="true"'}>${SYM[k]}</svg>`;

/* =========================================================================
   2. Instruments (inline SVG drawn from code)
   ========================================================================= */
const pol = (cx, cy, r, aDeg) => [cx + r * Math.sin(rad(aDeg)), cy - r * Math.cos(rad(aDeg))]; /* angle clockwise from top */
const arcPath = (cx, cy, r, a0, a1) => { const [x0, y0] = pol(cx, cy, r, a0), [x1, y1] = pol(cx, cy, r, a1); const large = (a1 - a0) % 360 > 180 ? 1 : 0; return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`; };
const f2 = n => n.toFixed(2);

/* The Hour Dial: 24-hour ring with noon at the top and the Sun bead; an inner ring
   that fills through the current unequal hour; the ruler glyph at the centre. */
function hourDial({ t = NOW, labels = true, glyph = true, size = 200, id = '' } = {}) {
  const h = hourAt(t) || HOURS[5];
  const C = 100, R = 86, ang = s => ((s / 3600 - 12) / 24) * 360;
  const rise = ang(HOURS[0].s), set = ang(HOURS[12].s);
  let ticks = '';
  HOURS.forEach(x => { const [a, b] = [pol(C, C, R - 6, ang(x.s)), pol(C, C, R + 6, ang(x.s))]; ticks += `<path d="M${f2(a[0])} ${f2(a[1])}L${f2(b[0])} ${f2(b[1])}" stroke="var(--mat-platter)" stroke-width="1.6"/>`; });
  let lab = '';
  if (labels) [['12', 0], ['18', 90], ['00', 180], ['06', 270]].forEach(([s, a]) => { const [x, y] = pol(C, C, R - 18, a); lab += `<text x="${f2(x)}" y="${f2(y + 3.5)}" text-anchor="middle" font-size="10" fill="var(--label-2)" font-family="var(--font-ui)">${s}</text>`; });
  const frac = (t - h.s) / (h.e - h.s);
  const [sx, sy] = pol(C, C, R, ang(t));
  return `<svg viewBox="0 0 200 200" role="img" aria-label="Hour dial: ${pn(h.p)}, ${hourOrd(h)}, ${Math.floor((h.e - t) / 60)} minutes left">
    <circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="var(--dial-night)" stroke-width="9"/>
    <path d="${arcPath(C, C, R, rise, set)}" fill="none" stroke="var(--dial-day)" stroke-width="9"/>
    ${ticks}${lab}
    <circle cx="${C}" cy="${C}" r="58" fill="none" stroke="var(--fill-2)" stroke-width="5"/>
    <path d="${arcPath(C, C, 58, 0, Math.max(0.5, frac * 360))}" fill="none" stroke="var(--planet-${h.p})" stroke-width="5" stroke-linecap="butt"/>
    <circle cx="${f2(sx)}" cy="${f2(sy)}" r="6.5" fill="var(--planet-sun)" stroke="var(--mat-platter)" stroke-width="2"/>
    ${glyph ? `<text x="${C}" y="${C + 15}" text-anchor="middle" font-size="44" fill="var(--label)" font-family="var(--font-ui)">${P[h.p].g}</text>` : ''}
  </svg>`;
}

/* The Moon disc with its true terminator (k = illuminated fraction; limb = screen angle of the bright limb). */
function moonDisc({ k = 0.74, limb = -138, r = 46, hollow = false, rim = true } = {}) {
  const C = 50, rx = Math.abs(2 * k - 1) * r, sweep = k > 0.5 ? 1 : 0;
  const lit = `M0 ${-r}A${r} ${r} 0 0 1 0 ${r}A${f2(rx)} ${r} 0 0 ${sweep} 0 ${-r}Z`;
  return `<svg viewBox="0 0 100 100" role="img" aria-label="Moon waning, 74 percent lit">
    <circle cx="${C}" cy="${C}" r="${r}" fill="${hollow ? 'none' : 'var(--moon-dark)'}" ${hollow ? 'stroke="var(--state-void)" stroke-width="1.5"' : ''}/>
    ${hollow ? '' : `<path d="${lit}" transform="translate(${C} ${C}) rotate(${limb})" fill="var(--moon-lit)"/>`}
    ${rim && !hollow ? `<circle cx="${C}" cy="${C}" r="${r}" fill="none" stroke="var(--moon-rim)" stroke-width="1" vector-effect="non-scaling-stroke"/>` : ''}
  </svg>`;
}

/* The Moon Volvelle: zodiac with both luminaries, the 28 mansions (nature by fill weight),
   the lunation hinges measured from the Sun, and the disc with its true terminator. */
function volvelle({ moon = LON0.moon, sun = LON0.sun, compact = false } = {}) {
  /* compact (the Extra Large widget): no sign glyphs and no numerals, so nothing falls
     below the 11 pt widget floor; the 28-mansion ring, hinges and the disc remain. */
  const C = 160, toA = lon => 270 - lon; /* 0° Aries at the left, signs counter-clockwise */
  let s = '';
  /* zodiac ring */
  s += `<circle cx="${C}" cy="${C}" r="152" fill="var(--mat-platter)"/>`;
  for (let i = 0; i < 12; i++) {
    const [a, b] = [pol(C, C, 126, toA(i * 30)), pol(C, C, 150, toA(i * 30))];
    s += `<path d="M${f2(a[0])} ${f2(a[1])}L${f2(b[0])} ${f2(b[1])}" stroke="var(--label-4)" stroke-width="1"/>`;
    const [gx, gy] = pol(C, C, 138, toA(i * 30 + 15));
    if (!compact) s += `<text x="${f2(gx)}" y="${f2(gy + 4.5)}" text-anchor="middle" font-size="13" fill="var(--label-2)">${SIGNS[i][1]}</text>`;
  }
  s += `<circle cx="${C}" cy="${C}" r="150" fill="none" stroke="var(--label-4)"/><circle cx="${C}" cy="${C}" r="126" fill="none" stroke="var(--label-4)"/>`;
  /* mansion ring */
  const cur = Math.floor(norm(moon) / (360 / 28));
  for (let i = 0; i < 28; i++) {
    const a0 = toA((i + 1) * 360 / 28), a1 = toA(i * 360 / 28);
    const fill = { favorable: 'var(--mansion-fav)', mixed: 'var(--mansion-mixed)', unfavorable: 'var(--mansion-unfav)' }[MANSIONS[i][1]];
    const p0 = pol(C, C, 124, a0), p1 = pol(C, C, 124, a1), q1 = pol(C, C, 104, a1), q0 = pol(C, C, 104, a0);
    s += `<path d="M${f2(p0[0])} ${f2(p0[1])}A124 124 0 0 1 ${f2(p1[0])} ${f2(p1[1])}L${f2(q1[0])} ${f2(q1[1])}A104 104 0 0 0 ${f2(q0[0])} ${f2(q0[1])}Z" fill="${fill}" stroke="var(--mat-platter)" stroke-width="1.2"${i === cur ? ' class="cur"' : ''}><title>Mansion ${i + 1} · ${MANSIONS[i][0]} · ${MANSIONS[i][1]}</title></path>`;
    if (!compact && ((i + 1) % 7 === 1 || i === cur)) { const [nx, ny] = pol(C, C, 114, toA((i + 0.5) * 360 / 28)); s += `<text x="${f2(nx)}" y="${f2(ny + 3.5)}" text-anchor="middle" font-size="10" fill="var(--label)" font-weight="${i === cur ? 700 : 400}" class="num sec">${i + 1}</text>`; }
  }
  { const a0 = toA((cur + 1) * 360 / 28) , a1 = toA(cur * 360 / 28); const p0 = pol(C, C, 125.5, a0), p1 = pol(C, C, 125.5, a1), q1 = pol(C, C, 102.5, a1), q0 = pol(C, C, 102.5, a0);
    s += `<path d="M${f2(p0[0])} ${f2(p0[1])}A125.5 125.5 0 0 1 ${f2(p1[0])} ${f2(p1[1])}L${f2(q1[0])} ${f2(q1[1])}A102.5 102.5 0 0 0 ${f2(q0[0])} ${f2(q0[1])}Z" fill="none" stroke="var(--figure-ring-color)" stroke-width="1.5"/>`; }
  /* hinge ring: New · First Quarter · Full · Last Quarter, measured from the Sun */
  s += `<circle cx="${C}" cy="${C}" r="96" fill="none" stroke="var(--label-4)"/>`;
  [['New', 0, 'full'], ['First Quarter', 90, 'half'], ['Full', 180, 'none'], ['Last Quarter', 270, 'half2']].forEach(([n, e, kind]) => {
    const [x, y] = pol(C, C, 96, toA(sun + e));
    s += `<circle cx="${f2(x)}" cy="${f2(y)}" r="4.5" fill="${kind === 'full' ? 'var(--label)' : 'var(--mat-platter)'}" stroke="var(--label)" stroke-width="1.2"><title>${n}</title></circle>`;
    if (kind === 'half' || kind === 'half2') s += `<path d="M${f2(x)} ${f2(y - 4.5)}A4.5 4.5 0 0 ${kind === 'half' ? 0 : 1} ${f2(x)} ${f2(y + 4.5)}Z" fill="var(--label)"/>`;
  });
  /* luminaries on the zodiac */
  [['sun', sun], ['moon', moon]].forEach(([k, l]) => {
    const [x, y] = pol(C, C, 150, toA(l)), [x2, y2] = pol(C, C, 126, toA(l));
    s += `<path d="M${f2(x)} ${f2(y)}L${f2(x2)} ${f2(y2)}" stroke="var(--label)" stroke-width="1.5"/>`;
    const [bx, by] = pol(C, C, 163, toA(l));
    s += compact ? `<circle cx="${f2(bx)}" cy="${f2(by)}" r="6" fill="var(--label)" stroke="var(--mat-platter)" stroke-width="2"><title>${P[k].n}</title></circle>`
      : `<circle cx="${f2(bx)}" cy="${f2(by)}" r="10" fill="var(--tint-${k})"/><text x="${f2(bx)}" y="${f2(by + 4.5)}" text-anchor="middle" font-size="13" fill="var(--label)">${P[k].g}</text>`;
  });
  /* the disc */
  s += `<g transform="translate(${C - 70} ${C - 70}) scale(1.4)">${moonDisc({ r: 46 }).replace(/^<svg[^>]*>/, '').replace(/<\/svg>$/, '')}</g>`;
  return `<svg viewBox="-16 -16 352 352" role="img" aria-label="Moon Volvelle: Moon 8°34′ Cancer, waning 74%, mansion 8 Al-Nathrah">${s}</svg>`;
}

/* The Hour Ribbon: 24 cells, each as wide as its real hour, over graded twilight,
   faint equal clock-hour ticks underneath, the gilt now-needle, pinned items. */
function ribbon({ id = 'rb', t = NOW, half = null, labels = true, ticks = true, interactive = true, minW = 560 } = {}) {
  const t0 = half === 'day' ? HOURS[0].s : half === 'night' ? HOURS[12].s : T_START;
  const t1 = half === 'day' ? HOURS[11].e : half === 'night' ? HOURS[23].e : T_END;
  const span = t1 - t0, X = s => ((s - t0) / span) * 100;
  const cur = hourAt(t);
  const list = HOURS.filter(h => h.s >= t0 && h.e <= t1);
  let cells = '';
  list.forEach(h => {
    const gapL = h.i === 12 ? 4 : 1, gapR = h.i === 11 ? 4 : 1;
    const isNow = cur && h.i === cur.i, sel = S.selHour === h.i;
    const bell = S.bells[h.i];
    const step = h.i === 6 ? `<span class="step" style="left:3px" aria-hidden="true"></span>` : '';
    const tag = interactive ? 'button' : 'span';

function viewCalendar() {
  if (S.calView !== 'month') return `<div class="view" style="padding-top:10px"><div class="platter" style="padding:32px;text-align:center"><p class="callout l2">${S.calView} view · this prototype draws Month only.</p></div></div>`;
  const L = S.layers, w = win();
  const hinge = { 1: 'LQ', 2: '✶︎', 9: '●', 13: '☿︎D', 14: '♀︎D', 17: 'FQ', 22: '☉︎→♐︎', 24: '○' };
  let ty = '';
  for (let d = 1; d <= 30; d++) ty += `<div class="hinge">${marks(hinge[d] || '')}</div>`;
  for (let d = 1; d <= 30; d++) ty += `<div class="num">${d}</div>`;
  for (let d = 1; d <= 30; d++) ty += `<div class="num">${d === 1 ? '♏︎' : d === 22 ? '♐︎' : ''}${SUN_DEG[d - 1]}°</div>`;
  const xAt = (col, frac) => `calc(${(col + frac).toFixed(4)} * ((100% - 36px) / 7) + ${col * 6}px)`;
  let weeks = '';
  for (let wk = 0; wk < 5; wk++) {
    let cells = '';
    for (let c = 0; c < 7; c++) {
      const d = wk * 7 + c + 1;
      if (d > 30) { cells += '<div class="dc blank" aria-hidden="true"></div>'; continue; }
      const info = NOV[d] || {}, rl = NOV_RULER[c];
      const sel = S.calSel === 'win' ? d === w.date : S.calSel === d;
      const closed = L.quality && d <= 13;
      let ev = '';
      if (d === 1 && L.voids) ev += `<span class="ev" title="Void ends 00:11 as she enters Leo">${marks('◌')} → 00:11</span>`;
      (info.ev || []).forEach(([s, , layer]) => { if (L[layer] !== false) ev += `<span class="ev">${marks(s)}</span>`; });
      if (d === 1) ev += `<span class="ev l2" title="Clocks go back an hour at 02:00; the hours do not move">DST 02:00</span>`;
      if (d === 4 && L.voids) ev += `<span class="ev">${marks('◌')} 02:14</span>`;
      if (d === 5 && L.voids) ev += `<span class="ev">→ 09:40</span>`;
      if (d === 1 && L.voids) ev += `<span class="ev">${marks('◌')} 20:41 →</span>`;
      if (d === 3 && L.voids) ev += `<span class="ev">→ 03:21</span>`;
      if (L.committed && d === w.date) ev += `<span class="ev c">◆<span class="evt"> ${w.start}</span></span>`;
      let mk = '';
      if (L.quality && info.caution) mk += `<span title="${info.caution}">${ic('caution', 'caution-ic')}</span>`;
      if (L.quality && info.broken) mk += `<span title="broken: ${info.broken}" aria-label="broken testimony">⊣</span>`;
      if (L.voids && info.voidMark) mk += `<span aria-label="void">${symSVG('dotted')}</span>`;
      const q = L.quality && info.q ? `<span class="q" aria-label="Election Quality ${info.q} of 4">${[1, 2, 3, 4].map(i => `<i class="${i <= info.q ? '' : 'o'}"></i>`).join('')}</span>` : '';
      /* Cells are neutral platters; the ruler tints only with the Day Rulers layer (off by default). */
      cells += `<button class="dc${L.rulers ? ' cell' : ''}${closed ? ' season-closed' : ''}" data-planet="${rl}" data-act="day" data-d="${d}" aria-selected="${sel}" aria-label="${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][c]} ${d} November, day of ${pn(rl)}${closed ? ', Venus closed: retrograde' : ''}${d === w.date ? ', committed Venus for concord ' + w.start : ''}">
        <span class="dn"><span class="num">${d}</span><span class="g ${L.rulers ? `pc-${rl}` : 'l2'}">${P[rl].g}</span></span>${ev}${mk ? `<span class="marks">${mk}</span>` : ''}${q}</button>`;
    }
    let spans = '';
    if (L.voids) NOV_VOIDS.forEach(([sd, sf, ed, ef, , aria]) => {
      if (Math.floor((sd - 1) / 7) !== wk || sd === ed) return;
      const c0 = (sd - 1) % 7, c1 = (ed - 1) % 7;
      const label = sd === 4 ? '31 h 26 min' : '30 h 40 min';
      spans += `<div class="span-bar void" style="left:${xAt(c0, sf)};width:calc(${xAt(c1, ef)} - ${xAt(c0, sf)});bottom:5px" aria-label="${aria}"><span>${label}</span></div>`;
    });
    weeks += `<div class="week">${cells}${spans}</div>`;
  }
  return `<div class="view cal">
    <div class="tbl-scroll" aria-label="The month’s tympanum: the Sun’s degrees aligned to the day numbers, with lunation hinges, stations and ingresses"><div class="tymp">${ty}</div></div>

  </div>`;

let OPEN_MENU = null;

function placeFloating(node, anchor, align = 'left') {
  const r = anchor.getBoundingClientRect(), w = node.offsetWidth, vw = document.documentElement.clientWidth;
  let x = align === 'right' ? r.right - w : r.left; x = Math.max(12, Math.min(x, vw - w - 12));
  node.style.left = x + 'px'; node.style.top = (r.bottom + 4) + 'px';
}
function openMenu(anchor, items, { align = 'left', cls = '', header = '', name = '' } = {}) {
  closeMenus();

  m.innerHTML = header + items.map(it => it === '-' ? '<div class="msep" role="separator"></div>' : typeof it === 'string' ? it :
    `<button class="mi" role="menuitem" ${it[2] ? `data-mact="${it[2]}"` : 'disabled'} ${it[3] ? `aria-checked="true"` : ''}><span class="mk">${it[3] ? '✓' : ''}</span><span class="t">${it[0]}</span>${it[1] ? `<span class="sc">${it[1]}</span>` : ''}</button>`).join('');
  document.getElementById('layer').appendChild(m);

  anchor.setAttribute('aria-expanded', 'true');
  OPEN_MENU = { node: m, anchor, returnFocus: anchor };
  const first = m.querySelector('.mi:not([disabled])'); if (first) first.focus({ preventScroll: true });

}
function openPopover(anchor, html, { align = 'left', label = '' } = {}) {
